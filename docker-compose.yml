# Runs Postgres + the API. On first boot the API seeds synthetic data and
# trains the model, then serves. API: http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://food:food@postgres:5432/food
      MODEL_DIR: /app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
