<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#6b7280"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">AI Food Waste Prediction Platform</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">XGBoost demand forecasting → order recommendations + spoilage-risk · Python · FastAPI · PostgreSQL</text>

  <!-- lane labels -->
  <text x="30" y="82" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">OFFLINE · TRAINING</text>
  <text x="30" y="232" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">ONLINE · SERVING</text>

  <!-- training lane -->
  <g>
    <rect x="30" y="92" width="180" height="66" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="120" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Data (synthetic)</text>
    <text x="120" y="136" text-anchor="middle" font-size="10.5" fill="#374151">sales · weather · calendar</text>
  </g>
  <g>
    <rect x="250" y="92" width="180" height="66" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="340" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Feature engineering</text>
    <text x="340" y="136" text-anchor="middle" font-size="10.5" fill="#374151">lags · rolling · calendar (no leakage)</text>
  </g>
  <g>
    <rect x="470" y="86" width="230" height="78" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="585" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">XGBoost (Poisson)</text>
    <text x="585" y="126" text-anchor="middle" font-size="10.5" fill="#374151">time-split + walk-forward backtest</text>
    <text x="585" y="143" text-anchor="middle" font-size="10.5" fill="#374151">MAE · RMSE · MAPE</text>
  </g>
  <g>
    <rect x="760" y="92" width="180" height="66" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="850" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Model registry</text>
    <text x="850" y="136" text-anchor="middle" font-size="10.5" fill="#374151">version + metrics</text>
  </g>

  <line x1="210" y1="125" x2="248" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="430" y1="125" x2="468" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="700" y1="125" x2="758" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="729" y="118" text-anchor="middle" font-size="9.5" fill="#6b7280">save</text>

  <!-- serving lane -->
  <g>
    <rect x="30" y="242" width="180" height="66" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="120" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">PostgreSQL / SQLite</text>
    <text x="120" y="286" text-anchor="middle" font-size="10.5" fill="#374151">sales · predictions</text>
  </g>
  <g>
    <rect x="250" y="238" width="180" height="74" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="340" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">FastAPI service</text>
    <text x="340" y="280" text-anchor="middle" font-size="10.5" fill="#374151">/forecast /recommendations</text>
    <text x="340" y="296" text-anchor="middle" font-size="10.5" fill="#374151">/spoilage-risk</text>
  </g>
  <g>
    <rect x="470" y="234" width="230" height="82" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="585" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Recommendations</text>
    <text x="585" y="275" text-anchor="middle" font-size="10.5" fill="#374151">order qty + safety stock</text>
    <text x="585" y="291" text-anchor="middle" font-size="10.5" fill="#374151">spoilage risk (money at risk)</text>
  </g>
  <g>
    <rect x="760" y="242" width="180" height="66" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="850" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Recursive forecast</text>
    <text x="850" y="286" text-anchor="middle" font-size="10.5" fill="#374151">next N days / item</text>
  </g>

  <!-- serving arrows (right to left) -->
  <line x1="760" y1="275" x2="702" y2="275" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="275" x2="432" y2="275" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="268" text-anchor="middle" font-size="9.5" fill="#6b7280">serve</text>

  <!-- registry -> forecast (load) -->
  <line x1="850" y1="158" x2="850" y2="240" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="884" y="203" text-anchor="middle" font-size="9.5" fill="#6b7280">load model</text>

  <!-- store -> features (history), up -->
  <line x1="120" y1="242" x2="120" y2="160" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="120" y="205" text-anchor="middle" font-size="9.5" fill="#6b7280">history</text>

  <!-- scheduler -->
  <g>
    <rect x="355" y="360" width="290" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="500" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Scheduler (APScheduler)</text>
    <text x="500" y="396" text-anchor="middle" font-size="10" fill="#374151">daily batch · weekly retrain</text>
  </g>
  <path d="M 500,360 C 500,335 585,340 585,316" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <text x="470" y="336" text-anchor="middle" font-size="9.5" fill="#9ca3af">batch</text>
  <path d="M 620,360 C 660,320 585,200 585,166" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <text x="662" y="250" text-anchor="middle" font-size="9.5" fill="#9ca3af">retrain</text>
</svg>
